name: CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Calculate dependency remediation
        run: |
          npm audit fix --package-lock-only
          git diff -- package-lock.json
          npm audit --audit-level=high

      - name: Verify
        run: npm run check
